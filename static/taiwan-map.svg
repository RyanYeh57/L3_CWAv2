<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" class="taiwan-svg-map">
  <defs>
    <filter id="map-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 離島區外框標示 -->
  <g class="islands-box">
    <!-- 連江縣 (馬祖) 區域框 -->
    <rect x="20" y="30" width="120" height="90" rx="8" class="island-frame" />
    <text x="30" y="48" class="island-title">連江縣 (馬祖)</text>
    
    <!-- 金門縣 區域框 -->
    <rect x="20" y="135" width="120" height="100" rx="8" class="island-frame" />
    <text x="30" y="153" class="island-title">金門縣</text>

    <!-- 澎湖縣 區域框 -->
    <rect x="20" y="380" width="130" height="150" rx="8" class="island-frame" />
    <text x="30" y="398" class="island-title">澎湖縣</text>
  </g>

